name: weather-watchlist

x-backend-environment: &backend-environment
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: app
  MYSQL_PASSWORD: app

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: weather
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      <<: *backend-environment
      MYSQL_DATABASE: weather
      REDIS_URL: redis://redis:6379/0
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    environment:
      NUXT_BACKEND_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      <<: *backend-environment
      NODE_ENV: test
      MYSQL_DATABASE: weather_test
      REDIS_URL: redis://redis:6379/1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test

volumes:
  mysql-data:
